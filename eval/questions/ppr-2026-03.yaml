# Question set — Riksbank PPR March 2026 (manifest riksbank-ppr.yaml, name ppr-2026-03)
#
# Every answer is CATEGORICAL so grading is deterministic (no judge model):
#   number : the answerer replies with a number at `decimals` precision; correct if
#            |answer - key| <= tolerance
#   bool   : ja/nej
#   choice : one of `options` (verbatim)
# Keys were read from the rendered figure by a human (2026-09-22), NOT from any
# model's description — the set must never be derived from the thing it measures.
# `figure_only: true` marks facts the body text does not state, i.e. the question
# can only be answered from the figure description.
# Figure ids are page + figure index on that page (page-010-diagram-01 = first
# chart on page 10); the caption field identifies the figure independently of
# any pipeline's numbering.
#
# Coverage: 13 of 41 charts so far. Extend with the same discipline; more
# questions per figure beats cleverer questions — the point is that no single
# prompt can be tuned to the set.

document: ppr-2026-03
figures:

