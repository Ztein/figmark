# Office documents (29 .docx/.pptx/.xlsx). Two kinds, on purpose:
#   fixture       — Apache POI test fixtures pinned to one commit (immutable URLs),
#                   exercising hard corners: tracked changes, comments, footnotes,
#                   merged cells, formulas, charts, pivot tables, SmartArt.
#   public-sector — real government documents (sv + en).
# `features` lists what each file stresses. Embedded charts carry their exact
# values in chart XML — the source of free ground truth for chart reading.
# Documents keep their original licenses; used for local evaluation only.
documents:
  # ============================== docx ==============================
  - name: poi-tracked-changes
    format: docx
    kind: fixture
    url: https://raw.githubusercontent.com/apache/poi/11cc6dd6740b47a68164ea6db4558d36b1fec8ae/test-data/document/documentProtection_trackedChanges_no_password.docx
    source: Apache POI test-data (Apache License 2.0)
    language: en
    features: [tracked-changes, document-protection]
  - name: poi-comments
    format: docx
    kind: fixture
    url: https://raw.githubusercontent.com/apache/poi/11cc6dd6740b47a68164ea6db4558d36b1fec8ae/test-data/document/testComment.docx
    source: Apache POI test-data (Apache License 2.0)
    language: en
    features: [comments, embedded-image]
  - name: poi-footnotes
    format: docx
    kind: fixture
    url: https://raw.githubusercontent.com/apache/poi/11cc6dd6740b47a68164ea6db4558d36b1fec8ae/test-data/document/footnotes.docx
    source: Apache POI test-data (Apache License 2.0)
    language: en
    features: [footnotes, endnotes]
  - name: poi-pictures
    format: docx
    kind: fixture
    url: https://raw.githubusercontent.com/apache/poi/11cc6dd6740b47a68164ea6db4558d36b1fec8ae/test-data/document/VariousPictures.docx
    source: Apache POI test-data (Apache License 2.0)
    language: en
    features: [embedded-images]  # 5 bilder i olika format
  - name: poi-chart-docx
    format: docx
    kind: fixture
    url: https://raw.githubusercontent.com/apache/poi/11cc6dd6740b47a68164ea6db4558d36b1fec8ae/test-data/document/chartex.docx
    source: Apache POI test-data (Apache License 2.0)
    language: en
    features: [embedded-chart]
  - name: govuk-tracked-consultation
    format: docx
    kind: public-sector
    url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/1064094/cpr-revised-pd-16-tracked-consultation.docx
    source: UK Ministry of Justice, Civil Procedure Rules PD16 consultation draft (Open Government Licence)
    language: en
    features: [tracked-changes, legal-styles]  # riktigt dokument med spårade ändringar
  - name: govuk-social-care-consultation
    format: docx
    kind: public-sector
    url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/532343/Future_of_social_care_inspection_-_consultation_document.docx
    source: Ofsted, Future of social care inspection consultation (Open Government Licence)
    language: en
    features: [long-document, toc, headings, embedded-images]  # 840 KB
  - name: skr-kommunbas
    format: docx
    kind: public-sector
    url: https://skr.se/download/18.3d6041b7199690a4d3d8500a/1758616513027/Kommun-BAS-25-redigerad-240815.docx
