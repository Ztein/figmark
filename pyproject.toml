[project]
name = "figmark"
version = "0.0.0"
description = "Local pipeline that turns documents into text, including what their figures say"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "docling>=2.50",
    "pyyaml>=6",
]

[project.scripts]
figmark = "figmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
eval = [
    "openai>=1.60",
    "pyyaml>=6",
    "numpy>=1.26",
    "rapidfuzz>=3",
]

[tool.uv]
default-groups = ["eval"]
