[project]
name = "figmark"
version = "0.0.0"
description = "Local pipeline that turns documents into text, including what their figures say"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = []

[dependency-groups]
eval = [
    "docling>=2.50",
    "openai>=1.60",
    "pyyaml>=6",
    "numpy>=1.26",
]

[tool.uv]
default-groups = ["eval"]
package = false
